name: PFx Responsive Windows Release
on:
  push:
    paths:
      - '.github/workflows/publish-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    if: github.repository == 'pfxamd/pfx-responsive' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Copy tested Windows Core snapshot
        uses: actions/checkout@v4
        with:
          repository: pfxamd/PFx-Preview-Core
          ref: e527e7841f7e6f61d730b523f36aacc327ad7f14
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run app checks and tests
        shell: pwsh
        run: |
          npm run check
          npm test
      - name: Build standalone Windows archive with Core and Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = '0'
          Push-Location core
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright-core install chromium
          Pop-Location
          ./scripts/package-windows.ps1
      - name: Unpack and smoke-test exact release ZIP on Windows
        shell: pwsh
        run: ./scripts/test-windows-portable.ps1
      - name: Publish Windows portable pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path 'out/PFx-Responsive-Windows-x64.zip').Path
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'out/SHA256SUMS.txt' -Value "$hash  PFx-Responsive-Windows-x64.zip" -Encoding utf8
          @'
          PFx Responsive Windows x64 — portable alpha

          Download PFx-Responsive-Windows-x64.zip. Extract once, open the
          PFx Responsive folder, and double-click PFx Responsive.exe.
          No Docker or Node.js/Chromium/.NET installation is needed.
          Firefox is opened when installed; otherwise the default browser.

          This release packages a fixed copy of the independently published
          PFx Preview Core. It runs on the local computer only and needs
          internet access when opening external sites. Not for public hosting.

          The Windows Actions job tests the EXE, local services, a real
          Chromium screenshot, and session cleanup from the extracted ZIP.
          '@ | Set-Content -Path 'out/release-notes.md' -Encoding utf8
          gh release create v0.2.0-alpha.2 $zip 'out/SHA256SUMS.txt' --target $env:GITHUB_SHA --title 'PFx Responsive v0.2.0-alpha.2 - Windows portable' --prerelease --notes-file 'out/release-notes.md'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
          $assets = gh release view v0.2.0-alpha.2 --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0 -or $assets -notcontains 'PFx-Responsive-Windows-x64.zip') { throw 'Release ZIP asset could not be verified' }
          Write-Host "RELEASE_PUBLISHED: tag=v0.2.0-alpha.2 asset=PFx-Responsive-Windows-x64.zip sha256=$hash"
