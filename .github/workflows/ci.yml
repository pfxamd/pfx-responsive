name: PFx Responsive Foundation CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
