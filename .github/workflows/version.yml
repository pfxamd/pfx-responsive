name: PFx Responsive source version
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .pfx/release.mjs --sync
      - run: node .pfx/release.mjs --check
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node .pfx/release.mjs --publish
